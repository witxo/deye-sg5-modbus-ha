# =====================================================================
# Deye single-phase low-voltage hybrid inverter register map
# Device type - SUN-*K-SG05LP1 AM2
# Tested on SUN-6K-SG05LP1 AM2 EU
#
# Source for mapping data: https://github.com/tema-mazy/deye-modbus-test 
# and https://github.com/VMrenato/homeassistant-deye-tcan485-esphome/
#
# Decoding notes:
#   * register_type: holding  -> read with FC03 (everything on this inverter)
#   * count: 2                -> 32-bit value across two registers
#   * word_order: low_high    -> low word sits at the base address (Deye energy
#                                counters are little-endian by word)
#   * temperatures            -> offset 1000, scale 0.1  =>  (raw-1000)*0.1 = °C
#   * signed: true            -> value is two's-complement (marked "S16" in doc)
# =====================================================================
# Writable controls below were verified on real hardware for this map.
writes_supported: true

sensors:
  # Status
  - name: Run State
    unique_id: run_state
    register_type: holding
    address: 59
    count: 1
    options:
      0: standby
      1: self-check
      2: normal
      3: alarm
      4: fault

  # ---------------------------------------
  # PV Section 
  # PV1
  - name: PV1 Voltage
    unique_id: pv1_voltage
    register_type: holding
    address: 109
    count: 1
    scale: 0.1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement

  - name: PV1 Current
    unique_id: pv1_current
    register_type: holding
    address: 110
    count: 1
    scale: 0.1
    unit_of_measurement: A
    device_class: current
    state_class: measurement

  - name: PV1 Power
    unique_id: pv1_power
    register_type: holding
    address: 186
    count: 1
    scale: 1
    unit_of_measurement: W
    device_class: power
    state_class: measurement

  # PV2
  - name: PV2 Voltage
    unique_id: pv2_voltage
    register_type: holding
    address: 111
    count: 1
    scale: 0.1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement

  - name: PV2 Current
    unique_id: pv2_current
    register_type: holding
    address: 112
    count: 1
    scale: 0.1
    unit_of_measurement: A
    device_class: current
    state_class: measurement

  - name: PV2 Power
    unique_id: pv2_power
    register_type: holding
    address: 187
    count: 1
    scale: 1
    unit_of_measurement: W
    device_class: power
    state_class: measurement

  # ---------------------------------------
  # Grid
  # ---------------------------------------

  - name: Grid Voltage
    unique_id: grid_voltage
    register_type: holding
    address: 150
    count: 1
    scale: 0.1
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement

  - name: Grid Frequency
    unique_id: grid_frequency
    register_type: holding
    address: 79
    count: 1
    scale: 0.01
    unit_of_measurement: Hz
    precision: 2
    device_class: frequency
    state_class: measurement

  - name: Grid Power
    unique_id: grid_power
    register_type: holding
    address: 169
    count: 1
    scale: 1
    signed: true
    unit_of_measurement: W
    device_class: power
    state_class: measurement

  - name: Grid CT Power
    unique_id: grid_ct_power
    register_type: holding
    address: 172
    count: 1
    scale: 1
    signed: true
    unit_of_measurement: W
    device_class: power
    state_class: measurement

  # ---------------------------------------
  # Battery
  # ---------------------------------------

  - name: Battery SOC
    unique_id: battery_soc
    register_type: holding
    address: 184
    count: 1
    scale: 1
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement

  - name: Battery Voltage
    unique_id: battery_voltage
    register_type: holding
    address: 183
    count: 1
    scale: 0.01
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement

  - name: Battery Current
    unique_id: battery_current
    register_type: holding
    address: 191
    count: 1
    scale: 0.01
    signed: true
    unit_of_measurement: A
    device_class: current
    state_class: measurement

  - name: Battery Power
    unique_id: battery_power
    register_type: holding
    address: 190
    count: 1
    scale: 1
    signed: true
    unit_of_measurement: W
    device_class: power
    state_class: measurement

  - name: Battery Temperature
    unique_id: battery_temperature
    register_type: holding
    address: 182
    count: 1
    scale: 0.1
    offset: 1000
    signed: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  # ---------------------------------------
  # Inverter and load power
  # ---------------------------------------

  - name: Inverter Power
    unique_id: inverter_power
    register_type: holding
    address: 175
    count: 1
    scale: 1
    signed: true
    unit_of_measurement: W
    device_class: power
    state_class: measurement

  - name: Load Power
    unique_id: load_power
    register_type: holding
    address: 178
    count: 1
    scale: 1
    signed: true
    unit_of_measurement: W
    device_class: power
    state_class: measurement

  # ---------------------------------------
  #Inverter temperature sensors
  # ---------------------------------------

  - name: DC Transformer
    unique_id: inverter_dc_transformer_temp
    register_type: holding
    address: 90
    count: 1
    scale: 0.1
    offset: 1000
    signed: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  - name: Inverter heatsink
    unique_id: inverter_heatsink_temp
    register_type: holding
    address: 91
    count: 1
    scale: 0.1
    offset: 1000
    signed: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  - name: Inverter external temperature sensor
    unique_id: inverter_external_temp
    register_type: holding
    address: 95
    count: 1
    scale: 0.1
    offset: 1000
    signed: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement

  # ---------------------------------------
  #Energy totals
  # ---------------------------------------

  - name: PV Production Total
    unique_id: pv_energy_total
    register_type: holding
    address: 96
    count: 2
    word_order: low_high
    scale: 0.1
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing

  - name: Load Total
    unique_id: load_energy_total
    register_type: holding
    address: 85
    count: 2
    word_order: low_high
    scale: 0.1
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing

  - name: Grid Import Total
    unique_id: grid_import_total
    register_type: holding
    address: 78
    second_address: 80
    count: 2
    word_order: low_high
    scale: 0.1
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing

  - name: Grid Export Total
    unique_id: grid_export_total
    register_type: holding
    address: 81
    count: 2
    word_order: low_high
    scale: 0.1
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing

  - name: Battery Charge Total
    unique_id: battery_charge_total
    register_type: holding
    address: 72
    count: 2
    word_order: low_high
    scale: 0.1
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing

  - name: Battery Discharge Total
    unique_id: battery_discharge_total
    register_type: holding
    address: 74
    count: 2
    word_order: low_high
    scale: 0.1
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing


# =====================================================================
# Writable controls (settings block 200-280).
# Only loaded when "Allow changing inverter settings" is enabled in the
# integration options. Each control gets a hidden read-back sensor (polled
# every 4th cycle) and every write is range-checked, rate-limited and verified.
#
# Addresses verified on a SUN-6K-SG05LP1-EU-AM2-P (2026-11-25) by reading the
# block and matching it against the inverter's own settings
# (e.g. 204 = 314 Ah, 235 = 2 micro-inverter on GEN, 244 = 2 zero export to CT).
#
# GEN port controls (225-239) were added on request. GEN Port Mode is disabled
# by default: changing it with an AC-coupled inverter on the GEN input stops
# that inverter's power from being used.
#
# Deliberately NOT exposed: battery type and voltages, grid/country
# parameters, inverter on/off.
# =====================================================================
controls:

  # ------------------------------------------------------------- battery
  - type: number
    name: Battery Max Charge Current
    unique_id: batt_max_charge_current
    address: 210
    min: 0
    max: 135
    step: 1
    unit_of_measurement: A
    icon: mdi:battery-arrow-up

  - type: number
    name: Battery Max Discharge Current
    unique_id: batt_max_discharge_current
    address: 211
    min: 0
    max: 135
    step: 1
    unit_of_measurement: A
    icon: mdi:battery-arrow-down

  - type: number
    name: Battery Shutdown SOC
    unique_id: batt_shutdown_soc
    address: 217
    min: 5
    max: 50
    unit_of_measurement: '%'
    icon: mdi:battery-off-outline
    less_than: batt_low_soc

  - type: number
    name: Battery Restart SOC
    unique_id: batt_restart_soc
    address: 218
    min: 10
    max: 80
    unit_of_measurement: '%'
    icon: mdi:battery-sync-outline
    greater_than: batt_low_soc

  - type: number
    name: Battery Low SOC
    unique_id: batt_low_soc
    address: 219
    min: 5
    max: 60
    unit_of_measurement: '%'
    icon: mdi:battery-alert-variant-outline
    greater_than: batt_shutdown_soc
    less_than: batt_restart_soc

  # ------------------------------------------------------------- grid charge
  - type: switch
    name: Grid Charge
    unique_id: grid_charge_enable
    address: 232
    on_value: 1
    off_value: 0
    icon: mdi:transmission-tower-import

  - type: number
    name: Grid Charge Current
    unique_id: grid_charge_current
    address: 230
    min: 0
    max: 135
    step: 1
    unit_of_measurement: A
    icon: mdi:current-dc

  # ------------------------------------------------------------- GEN port
  # 235: what is connected to the GEN terminals.
  - type: select
    name: GEN Port Mode
    unique_id: gen_port_mode
    address: 235
    icon: mdi:engine
    enabled_default: false
    options:
      - label: Generator Input
        value: 0
      - label: Smart Load Output
        value: 1
      - label: Micro Inverter Input
        value: 2

  - type: switch
    name: GEN Charge
    unique_id: gen_charge_enable
    address: 231
    on_value: 1
    off_value: 0
    icon: mdi:engine

  - type: number
    name: GEN Charge Start Voltage
    unique_id: gen_charge_start_voltage
    address: 225
    min: 40
    max: 60
    step: 0.1
    write_factor: 100
    unit_of_measurement: V
    icon: mdi:flash-triangle-outline

  - type: number
    name: GEN Charge Start SOC
    unique_id: gen_charge_start_soc
    address: 226
    min: 0
    max: 100
    unit_of_measurement: '%'
    icon: mdi:battery-charging-outline

  - type: number
    name: GEN Charge Current
    unique_id: gen_charge_current
    address: 227
    min: 0
    max: 135
    unit_of_measurement: A
    icon: mdi:current-dc

  # 236-239: battery thresholds for the GEN port. In Smart Load mode they switch
  # the load off/on; in Micro Inverter mode they cut the micro-inverter off when
  # the battery is full (OFF) and let it back on (ON).
  - type: number
    name: GEN Off Battery Voltage
    unique_id: gen_off_voltage
    address: 236
    min: 40
    max: 60
    step: 0.1
    write_factor: 100
    unit_of_measurement: V
    icon: mdi:flash-off-outline

  - type: number
    name: GEN Off Battery SOC
    unique_id: gen_off_soc
    address: 237
    min: 0
    max: 100
    unit_of_measurement: '%'
    icon: mdi:battery-off-outline

  - type: number
    name: GEN On Battery Voltage
    unique_id: gen_on_voltage
    address: 238
    min: 40
    max: 60
    step: 0.1
    write_factor: 100
    unit_of_measurement: V
    icon: mdi:flash-outline

  - type: number
    name: GEN On Battery SOC
    unique_id: gen_on_soc
    address: 239
    min: 0
    max: 100
    unit_of_measurement: '%'
    icon: mdi:battery-sync-outline

  # ------------------------------------------------------------- work mode
  - type: select
    name: Energy Pattern
    unique_id: energy_pattern
    address: 243
    icon: mdi:priority-high
    options:
      - label: Battery First
        value: 0
      - label: Load First
        value: 1

  - type: select
    name: Work Mode
    unique_id: work_mode
    address: 244
    icon: mdi:home-lightning-bolt
    options:
      - label: Selling First
        value: 0
      - label: Zero Export To Load
        value: 1
      - label: Zero Export To CT
        value: 2

  - type: number
    name: Max Sell Power
    unique_id: max_sell_power
    address: 245
    min: 0
    max: 6000
    step: 100
    unit_of_measurement: W
    icon: mdi:transmission-tower-export

  - type: switch
    name: Solar Sell
    unique_id: solar_sell
    address: 247
    on_value: 1
    off_value: 0
    icon: mdi:solar-power

  # ------------------------------------------------------------- time of use
  # 248 bit 0 = time-of-use enabled; bits 1-7 = weekdays (left untouched).
  - type: switch
    name: Time Of Use
    unique_id: tou_enable
    address: 248
    mask: 0x0001
    on_value: 1
    off_value: 0
    icon: mdi:clock-outline

  - type: time
    name: TOU 1 Start
    unique_id: tou1_time
    address: 250
    icon: mdi:clock-start
    less_than: tou2_time

  - type: time
    name: TOU 2 Start
    unique_id: tou2_time
    address: 251
    icon: mdi:clock-start
    greater_than: tou1_time
    less_than: tou3_time

  - type: time
    name: TOU 3 Start
    unique_id: tou3_time
    address: 252
    icon: mdi:clock-start
    greater_than: tou2_time
    less_than: tou4_time

  - type: time
    name: TOU 4 Start
    unique_id: tou4_time
    address: 253
    icon: mdi:clock-start
    greater_than: tou3_time
    less_than: tou5_time

  - type: time
    name: TOU 5 Start
    unique_id: tou5_time
    address: 254
    icon: mdi:clock-start
    greater_than: tou4_time
    less_than: tou6_time

  - type: time
    name: TOU 6 Start
    unique_id: tou6_time
    address: 255
    icon: mdi:clock-start
    greater_than: tou5_time

  - type: number
    name: TOU 1 Power
    unique_id: tou1_power
    address: 256
    min: 0
    max: 6000
    step: 100
    unit_of_measurement: W
    icon: mdi:flash

  - type: number
    name: TOU 2 Power
    unique_id: tou2_power
    address: 257
    min: 0
    max: 6000
    step: 100
    unit_of_measurement: W
    icon: mdi:flash

  - type: number
    name: TOU 3 Power
    unique_id: tou3_power
    address: 258
    min: 0
    max: 6000
    step: 100
    unit_of_measurement: W
    icon: mdi:flash

  - type: number
    name: TOU 4 Power
    unique_id: tou4_power
    address: 259
    min: 0
    max: 6000
    step: 100
    unit_of_measurement: W
    icon: mdi:flash

  - type: number
    name: TOU 5 Power
    unique_id: tou5_power
    address: 260
    min: 0
    max: 6000
    step: 100
    unit_of_measurement: W
    icon: mdi:flash

  - type: number
    name: TOU 6 Power
    unique_id: tou6_power
    address: 261
    min: 0
    max: 6000
    step: 100
    unit_of_measurement: W
    icon: mdi:flash

  - type: number
    name: TOU 1 SOC
    unique_id: tou1_soc
    address: 268
    min: 5
    max: 100
    unit_of_measurement: '%'
    icon: mdi:battery-clock

  - type: number
    name: TOU 2 SOC
    unique_id: tou2_soc
    address: 269
    min: 5
    max: 100
    unit_of_measurement: '%'
    icon: mdi:battery-clock

  - type: number
    name: TOU 3 SOC
    unique_id: tou3_soc
    address: 270
    min: 5
    max: 100
    unit_of_measurement: '%'
    icon: mdi:battery-clock

  - type: number
    name: TOU 4 SOC
    unique_id: tou4_soc
    address: 271
    min: 5
    max: 100
    unit_of_measurement: '%'
    icon: mdi:battery-clock

  - type: number
    name: TOU 5 SOC
    unique_id: tou5_soc
    address: 272
    min: 5
    max: 100
    unit_of_measurement: '%'
    icon: mdi:battery-clock

  - type: number
    name: TOU 6 SOC
    unique_id: tou6_soc
    address: 273
    min: 5
    max: 100
    unit_of_measurement: '%'
    icon: mdi:battery-clock

  # bit 0 = charge battery from grid during this slot; other bits untouched.
  - type: switch
    name: TOU 1 Grid Charge
    unique_id: tou1_grid_charge
    address: 274
    mask: 0x0001
    on_value: 1
    off_value: 0
    icon: mdi:transmission-tower-import

  # bit 0 = charge battery from grid during this slot; other bits untouched.
  - type: switch
    name: TOU 2 Grid Charge
    unique_id: tou2_grid_charge
    address: 275
    mask: 0x0001
    on_value: 1
    off_value: 0
    icon: mdi:transmission-tower-import

  # bit 0 = charge battery from grid during this slot; other bits untouched.
  - type: switch
    name: TOU 3 Grid Charge
    unique_id: tou3_grid_charge
    address: 276
    mask: 0x0001
    on_value: 1
    off_value: 0
    icon: mdi:transmission-tower-import

  # bit 0 = charge battery from grid during this slot; other bits untouched.
  - type: switch
    name: TOU 4 Grid Charge
    unique_id: tou4_grid_charge
    address: 277
    mask: 0x0001
    on_value: 1
    off_value: 0
    icon: mdi:transmission-tower-import

  # bit 0 = charge battery from grid during this slot; other bits untouched.
  - type: switch
    name: TOU 5 Grid Charge
    unique_id: tou5_grid_charge
    address: 278
    mask: 0x0001
    on_value: 1
    off_value: 0
    icon: mdi:transmission-tower-import

  # bit 0 = charge battery from grid during this slot; other bits untouched.
  - type: switch
    name: TOU 6 Grid Charge
    unique_id: tou6_grid_charge
    address: 279
    mask: 0x0001
    on_value: 1
    off_value: 0
    icon: mdi:transmission-tower-import
